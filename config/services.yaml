# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    redis.host: '%env(REDIS_HOST)%'
    redis.port: '%env(int:REDIS_PORT)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    redis.default:
        class: App\Redis\RedisClient
        calls:
            - method: connect
              arguments:
                  - '%redis.host%'
                  - '%redis.port%'
                  - 0

    redis.word_repository:
        class: App\Redis\RedisClient
        calls:
            - method: connect
              arguments:
                  - '%redis.host%'
                  - '%redis.port%'
                  - 1

    App\Application\Repository\Redis\Game\RedisGameRepository:
        arguments:
            $redis: '@redis.default'

    App\Application\Repository\Redis\Game\RedisWordRepository:
        arguments:
            $redis: '@redis.word_repository'
            $dbIndex: 1

    App\Game\Repository\WordRepositoryInterface: '@App\Application\Repository\Redis\Game\RedisWordRepository'

    App\Game\Repository\GameRepositoryInterface: '@App\Application\Repository\Redis\Game\RedisGameRepository'

    App\Redis\RedisClientInterface: '@redis.default'

    App\Game\Service\GameServiceInterface: '@App\Game\Service\GameService'
